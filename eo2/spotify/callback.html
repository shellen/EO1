<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Back to your frame</title>
<style>
  :root{--bg:#f4f2ee;--ink:#1b1a18;--muted:#6f6a63}
  @media (prefers-color-scheme:dark){:root{--bg:#111110;--ink:#f2efe9;--muted:#a19b92}}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:24px;box-sizing:border-box;text-align:center}
  p{color:var(--muted);max-width:30em}
</style>
</head>
<body>
<div><h1 id="h">Taking you back to your frame…</h1><p id="p"></p></div>
<script>
// Spotify only redirects to https addresses; the frame's own page is plain http on the home
// network. This page receives Spotify's one-time code and hands it straight to the frame page,
// whose address travels in `state`. The code is useless without the secret the frame page kept
// on your phone (PKCE), and this page only forwards to private-network or tailnet addresses.
(function(){
  var q = new URLSearchParams(location.search);
  function fail(msg){ document.getElementById("h").textContent = "Couldn’t finish connecting"; document.getElementById("p").textContent = msg; }
  var state = q.get("state") || "", target = "";
  try { target = JSON.parse(atob(state.replace(/-/g, "+").replace(/_/g, "/"))).f || ""; } catch (e) {}
  var u; try { u = new URL(target); } catch (e) { return fail("This link didn’t come from your frame’s page. Start again from the frame’s Extras section."); }
  var h = u.hostname;
  var ok = /^(https?):$/.test(u.protocol) && (
    /^10\./.test(h) || /^192\.168\./.test(h) || /^172\.(1[6-9]|2\d|3[01])\./.test(h) ||
    /^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\./.test(h) ||          // Tailscale addresses
    /\.local$/.test(h) || /\.ts\.net$/.test(h) || h === "localhost" || h === "127.0.0.1");
  if (!ok) return fail("For safety this page only returns to addresses on your own network or tailnet.");
  var p = new URLSearchParams();
  p.set("spotify_state", state);
  if (q.get("code")) p.set("spotify_code", q.get("code"));
  if (q.get("error")) p.set("spotify_error", q.get("error"));
  location.replace(u.origin + "/#" + p.toString());
})();
</script>
</body>
</html>
